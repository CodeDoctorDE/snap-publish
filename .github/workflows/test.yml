name: "build-test"
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - master
      - 'releases/*'
      - 'deps/**'

jobs:
  unit: # make sure build/ci work properly
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: '24'
        cache: npm
    - run: npm ci
    - run: npm run all
    - run: git diff --exit-code -- dist
  integration: # make sure the action works on a clean machine without building
    # Only run integration test if we have access to secrets
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/releases/')
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: CodeDoctorDE/snap-build@d58a0cbf6a491a03927bdd22b6630397f8295cf5 # deps/node24
      id: build
      with:
        path: './sample-project'
        snapcraft-args: pack
    - uses: ./
      with:
        snap: ${{ steps.build.outputs.snap }}
        release: edge
      env:
        SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.STORE_LOGIN }}
